<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6.6 互動狀態：Group Hover 效果 (解答)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-12 flex items-center justify-center min-h-screen">

    <div class="bg-white p-10 rounded-3xl shadow-xl max-w-sm w-full">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">聯絡我們</h2>

        <form class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">您的姓名</label>
                <input type="text" placeholder="例如：王小明"
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition-all placeholder:text-gray-300">
            </div>

            <!-- 使用 group 來包裹按鈕，實現 group-hover 變化 -->
            <button type="button"
                class="group w-full flex justify-center items-center gap-2 bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 active:scale-95 transition-all">
                <span>傳送訊息</span>
                <!-- 當父層(button)被 hover 時，這個箭頭圖示會向右位移 -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" 
                     class="w-5 h-5 transition-transform duration-300 group-hover:translate-x-2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                </svg>
            </button>
        </form>

        <div class="mt-8 pt-8 border-t border-gray-100">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Lab 6.6 完成目標</h3>
            <ul class="list-disc list-inside space-y-2 text-sm text-gray-600">
                <li>✅ 在按鈕上加入 <code>group</code> class。</li>
                <li>✅ 在按鈕內新增一個箭頭圖示。</li>
                <li>✅ 在箭頭圖示加上 <code>group-hover:translate-x-2</code> 以及 <code>transition-transform duration-300</code>。</li>
                <li>✅ 游標移到按鈕上時，箭頭會平滑地向右移動 8px。</li>
            </ul>
        </div>
    </div>

</body>

</html>
