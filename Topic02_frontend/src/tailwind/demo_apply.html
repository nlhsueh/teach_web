<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進階技巧：使用 @apply 解決 Class 過長問題</title>
    
    <!-- 1. 載入 Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 設定 type="text/tailwindcss" 讓瀏覽器可以解析 @apply 指令 -->
    <style type="text/tailwindcss">
        /* 自定義主要按鈕 (Primary Button) */
        .btn-primary {
            @apply block w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:bg-blue-700 hover:-translate-y-1 hover:shadow-xl active:scale-95 transition-all duration-300 text-center cursor-pointer;
        }

        /* 自定義卡片外觀 (Card Container) */
        .card-container {
            @apply bg-white p-8 sm:p-10 rounded-3xl shadow-xl ring-1 ring-slate-900/5;
        }

        /* 自定義輸入框 (Input Field) */
        .input-field {
            @apply w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center items-center p-4">

    <!-- 直接使用自定義的 .card-container，HTML 變得非常乾淨 -->
    <div class="card-container max-w-sm w-full mx-auto">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                </svg>
            </div>
            <h2 class="text-2xl font-black text-slate-800">訂閱電子報</h2>
            <p class="text-sm text-slate-500 mt-2">
                使用 `<style type="text/tailwindcss">` 和 `@apply` 指令，將複雜的 class 封裝起來！
            </p>
        </div>
        
        <form class="space-y-5" onsubmit="event.preventDefault();">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">電子郵件地址</label>
                <!-- 使用自定義的 .input-field -->
                <input type="email" placeholder="hello@example.com" class="input-field" required>
            </div>
            
            <!-- 使用自定義的 .btn-primary -->
            <button type="submit" class="btn-primary">
                立即訂閱
            </button>
        </form>
    </div>

</body>
</html>
