<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 圖片畫廊範例</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f0f0f0; }
        h1 { text-align: center; margin-bottom: 30px; color: #333; }

        /* ── 畫廊容器 ── */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        /* ── 每張圖片卡片 ── */
        .gallery-item {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            width: 220px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        /* ── 懸停效果 ── */
        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }

        .gallery-item .desc {
            padding: 10px;
            font-size: 0.9rem;
            color: #555;
            border-top: 1px solid #eee;
            text-align: center;
        }

        /* ── 說明區塊 ── */
        .note {
            margin-top: 30px;
            background: #eef3fb;
            border-left: 4px solid #3498db;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #333;
        }
        code { background: #eee; padding: 2px 5px; border-radius: 3px; font-size: 0.85em; }
    </style>
</head>
<body>
    <h1>CSS 圖片畫廊 (Image Gallery)</h1>

    <div class="gallery">
        <div class="gallery-item"><img src="https://picsum.photos/seed/301/400/300" alt="圖1"><div class="desc">城市風景</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/seed/302/400/300" alt="圖2"><div class="desc">自然景色</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/seed/303/400/300" alt="圖3"><div class="desc">海岸風光</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/seed/304/400/300" alt="圖4"><div class="desc">山林秘境</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/seed/305/400/300" alt="圖5"><div class="desc">古典建築</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/seed/306/400/300" alt="圖6"><div class="desc">夜間燈火</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/seed/307/400/300" alt="圖7"><div class="desc">野外探險</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/seed/308/400/300" alt="圖8"><div class="desc">花草特寫</div></div>
    </div>

    <div class="note">
        <strong>核心概念：</strong><br>
        使用 <code>border</code> 和 <code>box-shadow</code> 增加卡片層次感。<br>
        使用 <code>transition</code> 和 <code>:hover</code> 實作滑鼠移入時的浮起效果。<br>
        使用 <code>object-fit: cover</code> 確保圖片以固定尺寸顯示而不變形。<br>
        參考：<a href="https://www.w3schools.com/css/css_image_gallery.asp" target="_blank">W3Schools - CSS Image Gallery</a>
    </div>
</body>
</html>
