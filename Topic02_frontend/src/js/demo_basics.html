<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>JS Basics - 旅遊網歡迎訊息</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function welcomeUser() {
            alert("歡迎來到探索旅遊網，準備好您的下一次冒險了嗎？");
        }

        function changeTitle() {
            document.getElementById("promo").innerHTML = "限量：日本賞櫻 8 折起！";
            document.getElementById("promo").classList.add("text-red-600", "animate-pulse");
        }

        function testConsole() {
            console.log("資料讀取中... 開發者 XXX 正在測試功能");
            alert("請打開開發者工具 (F12) 的 Console 標籤查看結果。");
        }
    </script>
</head>
<body class="bg-gray-100 p-10 font-sans text-gray-800">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-lg border border-gray-200">
        <h1 class="text-3xl font-bold text-blue-600 border-b pb-4 mb-6">🎟️ 探索旅遊網 - JS 基礎範例</h1>

        <section class="mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">5.1.2 歡迎訊息測試 (Alert)</h2>
            <button onclick="welcomeUser()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg shadow transition">顯示歡迎視窗</button>
        </section>

        <section class="mb-8 bg-blue-50 p-6 rounded-xl">
            <h2 class="text-xl font-semibold mb-2 text-gray-700">5.1.3 改變畫面內容 (DOM 操作)</h2>
            <h3 id="promo" class="text-2xl font-black text-gray-800 mb-4 transition-colors">今日特惠行程即將公開...</h3>
            <button onclick="changeTitle()" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg shadow transition mr-2">揭曉優惠</button>
            <button onclick="testConsole()" class="bg-gray-700 hover:bg-gray-800 text-white px-6 py-2 rounded-lg shadow transition">Console 測試</button>
        </section>
        
        <a href="../index.html" class="text-blue-500 hover:underline text-sm font-semibold">← 回到大廳</a>
    </div>
</body>
</html>
