<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>實作題 Q1：Flexbox 旅遊卡片（解答）</title>
  <style>
    body {
      background-color: #e8edf2;
      font-family: sans-serif;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    /* ✅ TODO 1 解答：啟動 Flexbox，卡片水平排列，間距 24px */
    .card-container {
      display: flex;
      gap: 24px;
    }

    /* ✅ TODO 2 解答：卡片基本樣式 */
    .card {
      flex: 1;                              /* 三張卡片等寬平均分配 */
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    /* ✅ TODO 3 解答：hover 效果，陰影加深 */
    .card:hover {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    /* 以下 CSS 已寫好，不需要修改 */
    .card-header {
      background: linear-gradient(135deg, #1a73e8, #0d9488);
      color: white;
      padding: 20px;
      border-radius: 12px 12px 0 0;
      font-size: 1.4rem;
      font-weight: bold;
    }

    .card-body {
      padding: 16px 20px;
      color: #555;
      line-height: 1.6;
    }

    .card-footer {
      padding: 12px 20px;
      background-color: #f1f3f5;
      border-top: 1px solid #ddd;
      border-radius: 0 0 12px 12px;
      font-weight: bold;
      color: #333;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>旅遊目的地推薦</h1>

  <div class="card-container">

    <div class="card">
      <div class="card-header">🗼 東京</div>
      <div class="card-body">
        探索繁華的街道、古老的寺廟、多彩的文化與美食，日本首都的魅力無窮。
      </div>
      <div class="card-footer">價格：¥150,000 起</div>
    </div>

    <div class="card">
      <div class="card-header">🗺 巴黎</div>
      <div class="card-body">
        感受浪漫氣息、參觀世界級美術館、漫步在艾菲爾鐵塔下的光之城。
      </div>
      <div class="card-footer">價格：€1,200 起</div>
    </div>

    <div class="card">
      <div class="card-header">🌺 夏威夷</div>
      <div class="card-body">
        在美麗的海灘放鬆、享受熱帶陽光、衝浪與獨特的 Aloha 精神。
      </div>
      <div class="card-footer">價格：$2,800 起</div>
    </div>

  </div>
</body>
</html>
