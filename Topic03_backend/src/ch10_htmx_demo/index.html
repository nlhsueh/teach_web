<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX 基礎非同步範例 (Basic Asynchronous Demo)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient glowing background orbs */
        .glow-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        .orb-1 {
            background: #6366f1;
            top: 10%;
            left: 15%;
        }

        .orb-2 {
            background: #a855f7;
            bottom: 10%;
            right: 15%;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo-area {
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .logo-tag {
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--primary-gradient);
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .demo-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .demo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            filter: brightness(1.1);
        }

        .demo-btn:active {
            transform: translateY(1px);
        }

        #result {
            margin-top: 24px;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .placeholder-text {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
            border: 1px dashed var(--border-color);
            width: 100%;
            padding: 20px;
            border-radius: 14px;
        }
    </style>
</head>
<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="container">
        <div class="card">
            <div class="logo-area">
                <span class="logo-tag">HTMX</span>
                <span class="logo-tag" style="background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);">AJAX</span>
            </div>
            <h1>HTMX 基礎非同步範例</h1>
            <p class="desc">
                點擊下方按鈕，HTMX 將發送非同步 GET 請求取得 <code>update.html</code> 的內容，並直接替換至下方的區域中（無須重新整理頁面）。
            </p>
            
            <!-- HTMX Button: Fetch update.html and put inside #result -->
            <button class="demo-btn" hx-get="update.html" hx-target="#result">
                更新內容
            </button>
            
            <!-- Target container for HTMX response -->
            <div id="result">
                <div class="placeholder-text">這裡將被替換 (Waiting to be replaced...)</div>
            </div>
        </div>
    </div>
</body>
</html>
